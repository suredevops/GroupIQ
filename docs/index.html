<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroupIQ — Marriott Group Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white; padding: 40px 20px; }
        .card { background: white; border-radius: 20px; padding: 50px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .brand { font-size: 24px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
        .sub { font-size: 14px; color: #64748b; margin-bottom: 30px; }
        .btn { display: block; padding: 16px 24px; border-radius: 12px; font-size: 15px; font-weight: 600; text-decoration: none; margin-bottom: 14px; transition: all 0.2s; }
        .btn-primary { background: #1e40af; color: white; box-shadow: 0 4px 14px rgba(30,64,175,0.3); }
        .btn-primary:hover { background: #1e3a8a; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(30,64,175,0.4); }
        .btn-secondary { background: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; }
        .btn-secondary:hover { background: #e2e8f0; }
        .footer { margin-top: 24px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">Marriott | GroupIQ</div>
        <p class="sub">AI-Powered Group Booking Platform</p>
        <a href="book.html" class="btn btn-primary">Book Group Rooms</a>
        <a href="customer.html" class="btn btn-secondary">Track My Booking</a>
        <p class="footer">Accessible worldwide on any device</p>
    </div>
</body>
</html>
